<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desserts</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <header class="desserts">
            <h1>Desserts</h1>
        </header>
        <section class="div-cart">
            <div class="cart">
                <h2 class="tot">Your Cart (0)</h2>

                <div class="div-items-cart" style="display: none;">
                </div>

                <div class="div">
                    <img src="./images/illustration-empty-cart.svg" id="img-cart" alt="Cart Icon">
                    <p class="text">You added items will appear here</p>
                </div>
                <div class="delivery-info" style="display:none">
                    <img src="./images/icon-carbon-neutral.svg" alt="Árvore" class="tree-img">
                    <p class="delivery-phrase">This is a <span class="bold">carbon-neutral</span> delivery</p>
                </div>

                <button class="cart-btn" style="display:none">Confirm Order</button>
            </div>
        </section>
    </main>
    <script src="./js/script.js" type="module"></script>
</body>

</html>
