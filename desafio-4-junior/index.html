<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Contato</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <form action="#">
            <h1>Contact Us</h1>

            <div class="div-flex">
                <div class="div-flex-column margin-right">
                    <label for="first-name">First Name <span class="required">*</span></label>
                    <input type="text" name="first-name" id="first-name" autocomplete="given-name" required>
                </div>

                <div class="div-flex-column">
                    <label for="last-name">Last Name <span class="required">*</span></label>
                    <input type="text" name="last-name" id="last-name" autocomplete="family-name" required>
                </div>
            </div>

            <label for="email">Email Address <span class="required">*</span></label>
            <input type="email" id="email" name="email" autocomplete="email" required>

            <label for="option-enquiry">Query Type <span class="required">*</span></label>
            <div class="div-flex">
                <label for="option-enquiry" class="options margin-right">
                    <input type="radio" name="type" value="enquiry" id="option-enquiry" autocomplete="off" required>
                    General Enquiry
                </label>

                <label for="option-request" class="options">
                    <input type="radio" name="type" value="support" id="option-request" autocomplete="off" required>
                    Support Request
                </label>
            </div>

            <label for="message">Message <span class="required">*</span></label>
            <textarea name="message" id="message" autocomplete="off" required></textarea>

            <div class="div-select">
                <input type="checkbox" id="consent-checkbox" name="consent" required>
                <div id="consent">
                    <label for="consent-checkbox">I consent to being contacted by the team <span
                            class="required">*</span></label>
                </div>
            </div>

            <button class="btn" type="submit">Submit</button>
            <script src="script.js"></script>
        </form>
    </main>
</body>

</html>
